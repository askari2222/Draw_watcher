# Copy this file to `.github/workflows/daily-notify.yml` in your GitHub repo
# (GitHub does not allow editing workflow files from outside the repo).

name: Daily draw-risk Telegram notification

on:
  schedule:
    # 00:30 UTC = 08:30 Singapore time (UTC+8), every day
    - cron: "30 0 * * *"
  workflow_dispatch: # allows manual "Run workflow" for testing

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Analyze matches and send Telegram alert
        run: node scripts/telegram-daily-notify.js
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RISK_THRESHOLD: "50"
